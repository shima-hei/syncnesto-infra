name: Demo storage health

on:
  schedule:
    - cron: '23 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-storage-health
  cancel-in-progress: false

jobs:
  health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.10.11
          enable-cache: false
      - run: uv sync --frozen --no-dev
      - name: Read the existing private demo avatar
        env:
          DEMO_SUPABASE_PROJECT_REF: ${{ vars.DEMO_SUPABASE_PROJECT_REF }}
          DEMO_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.DEMO_SUPABASE_S3_ACCESS_KEY_ID }}
          DEMO_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.DEMO_SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: uv run --frozen --no-dev python -m scripts.demo_storage_health
