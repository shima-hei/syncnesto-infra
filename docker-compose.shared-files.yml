services:
  shared-files:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [mini, -dir=/data]
    ports:
      - "127.0.0.1:${SHARED_FILE_DELIVERY_PORT:-8333}:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${SHARED_FILE_DELIVERY_ACCESS_KEY_ID:?Create the private shared-files env file}
      AWS_SECRET_ACCESS_KEY: ${SHARED_FILE_DELIVERY_SECRET_ACCESS_KEY:?Create the private shared-files env file}
    volumes:
      - "${SHARED_FILE_DELIVERY_DATA_DIR:?Set the dedicated private data directory}:/data"
    restart: unless-stopped
